<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Matérias</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:#fff;
    padding:30px;
    width:400px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

label{
    display:block;
    margin:10px 0 5px;
}

input, select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<div class="container">
    <h1>Cadastro de Matérias</h1>

    <form>
        <label for="materia">Nome da Matéria</label>
        <input type="text" id="materia" placeholder="Digite a matéria">

        <label for="professor">Professor</label>
        <input type="text" id="professor" placeholder="Nome do professor">

        <label for="carga">Carga Horária</label>
        <input type="number" id="carga" placeholder="Horas">

        <label for="turno">Turno</label>
        <select id="turno">
            <option>Manhã</option>
            <option>Tarde</option>
            <option>Noite</option>
        </select>

        <button type="submit">Cadastrar</button>
    </form>
</div>

</body>
</html>
